name: Compliance Auditor

on:
  push:
    branches: [ "main" ]
    paths:
      - 'terraform/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main" ]

jobs:
  run-audit:
    runs-on: ubuntu-latest

    services:
      ministack:
        image: ministackorg/ministack:latest
        ports:
          - 4566:4566

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Lint the script first so syntax/quoting bugs fail fast
      - name: Run ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck audit-check.sh

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Deploy and Audit
      - name: Run Audit Against Emulator
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          chmod +x ./audit-check.sh
          terraform init
          terraform apply -auto-approve
          ./audit-check.sh